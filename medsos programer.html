<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman 2 Tombol</title>
    <style>
        /* Mengatur agar halaman tidak ada scrollbar dan latar belakang rapi */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-image: url(bg\ ig.jpg);
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

       
        .container{
            flex-direction: column;
            display: flex;
            justify-content: center; 
            align-items: center;     
            min-height: 100vh;   
            gap: 50px;   
        }

        /* Desain dasar tombol */
        .btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;  
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease-in-out;
            width: 220px;
            text-align: center;
        }

        /* Warna Tombol 1 (Utama / Biru) */
        .btn-faisal {
            background-color: #fd0dc5;
        }

        
        .btn-tama {
            background-color: #fd0dc5;
        }

        /* Efek saat tombol diarahkan kursor (hover) */
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            opacity: 0.9;
        }

        .btn h3 {
            color: rgb(252, 250, 250);
            margin: 0 0 4px 0;
            font-size: 14px;
        } 

        .btn p {
            color: #fce4ec; 
            margin: 0;
            font-size: 14px;
            font-weight: normal;
        }

    </style>
</head>
<body>

    <div class="container">
        
        <a href="https://www.instagram.com/faisaldanniz/" class="btn btn-faisal">
            <h3>
                faisal danniz
            </h3>
            <p>
                programer    
            </p>
        </a>

       
        <a href="https://www.instagram.com/hartama.tama/" class="btn btn-tama">
            <h3>
                hartama safari
            </h3>
            <p>
                pencari artikel
            </p>
            
        </a>
    </div>

</body>
</html>
